<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mini Calculator</title>
</head>
<body>
    <div class="parent">
        <input type="number" placeholder="Enter first number" id="num1" class="input-field">
        <input type="text" placeholder="Enter operator (+, -, *, /)" id="operator" class="opera">
        <input type="number" placeholder="Enter second number" id="num2" class="input-field2">
        <button id="calculate" class="btn">Calculate</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
